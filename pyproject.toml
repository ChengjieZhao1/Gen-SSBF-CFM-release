[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-ssbf-cfm"
version = "0.1.0"
description = "SIM codebook and FiLM-CFM code for generative site-specific beamforming."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Cheng-Jie Zhao"}
]
dependencies = [
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "torch>=2.4",
  "deepmimo>=4.0.0b11",
  "matplotlib>=3.8"
]

[tool.setuptools.packages.find]
where = ["src"]
